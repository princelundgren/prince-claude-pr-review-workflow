# Claude reviews a person's pull request and posts a summary whose first line is
# "## Claude review of <head sha>"; the agent or person merging reads it first. Callers run it on
# pull_request and pass their CLAUDE_CODE_OAUTH_TOKEN (README.md, "How to call it"). The review
# itself is the action in .github/actions/review/; this job runs it on a GitHub-hosted runner with
# the subprocess scrub on.
name: Claude review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  review:
    # A pull request from another repository gets no secrets, and the action rejects a bot actor,
    # such as Dependabot, so those runs could only fail. The author must be a person too, so Claude
    # never reads the text of a pull request a bot opened, such as Dependabot's release notes. This
    # gate covers only the author and the event's sender: commits inside a person's pull request can
    # come from anyone. A caller picks the trigger, so the event is checked here too.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.sender.type == 'User'
      && github.event.pull_request.user.type == 'User'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Claude gets this job's token, which can read the code and write to pull requests and nothing
    # more, instead of the Claude GitHub App's token, whose permissions this block can't narrow. The
    # allow list in the action's claude_args is what limits Claude to commenting.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Pinned by commit SHA, since a called workflow's checkout is the caller's repository, so a ./
      # path would point into it. A change to the action lands first and a second commit moves the
      # pin to it.
      - uses: princelundgren/prince-claude-pr-review-workflow/.github/actions/review@c247837a9b932fb7e73dadb71128ddb6caec3840
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
